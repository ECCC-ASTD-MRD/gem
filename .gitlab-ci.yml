    - mkdir -pv ${PIPELINE_SUBDIR}/work-rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo
    - ln -sf ${PIPELINE_SUBDIR}/work-rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo .
    - export GEM_WORK=work-rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo
    - ./scripts/link-dbase.sh
