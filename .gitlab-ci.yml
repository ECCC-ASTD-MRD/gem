    - cd ${PIPELINE_SUBDIR}/build-rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo
    - cmake --fresh -DSTRICT=TRUE -DWITH_NEMO=1 ${SRC_DIR}
    - time make -j $NCPUS
    - time make work
  artifacts:
    expire_in: 4 hrs
    paths:
    - work-rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo
    - gem_dbase

package:rhel-9-graniterapids-64-intel-2025.1.0:
   variables:
      ORD_SOUMET_CPUS: "2"
      ORD_SOUMET_W: "10"
      ORD_SOUMET_M: "8G"
      ORD_SOUMET_TMPFS: "1G"
   stage: package
   tags:
      - ppp7-concurrent
   only:
      - tags
      - /^dev_5\.[0-9]*$/
      - schedules
   dependencies:
      - build:rhel-9-graniterapids-64-intel-2025.1.0
      - build:rhel-9-graniterapids-64-intel-2025.1.0-gem-nemo
   script:
      - set +e
      - . ./.eccc_setup_intel_2025.1.0
      - set -e
      - cd ${PIPELINE_SUBDIR}/build-rhel-9-graniterapids-64-intel-2025.1.0
      - make package
      - ~/ci-admin/bin/ci-package-ssm.sh package ${ECCI_PROCESS}

