#!/bin/bash
_checkpoint 0 "GEM_module StageIN.cfg"

PREPTSK_mach=$(nodeinfo -n ${SEQ_CONTAINER}/Prep -f res | grep machine= | cut -d '=' -f 2)
PREPTSK_mach0=${PREPTSK_mach}
if [[ "x${PREPTSK_mach}" == "xwj" ]] ; then
   PREPTSK_mach=${ORDENV_TRUEHOST}
fi

if [[ ${MOD_GEM_crossmount_fs} == 1 || ${PREPTSK_mach} == ${ORDENV_TRUEHOST} ]] ; then
   prep=${SEQ_EXP_HOME}/hub/${PREPTSK_mach0}/work/${SEQ_DATE}/${SEQ_CONTAINER}/Prep${SEQ_CONTAINER_LOOP_EXT}/output/cfg_\${gem_domain}
else
   prep=${PREPTSK_mach}:${SEQ_EXP_HOME}/hub/${PREPTSK_mach0}/work/${SEQ_DATE}/${SEQ_CONTAINER}/Prep${SEQ_CONTAINER_LOOP_EXT}/output/cfg_\${gem_domain}
fi

